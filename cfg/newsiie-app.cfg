# newsiie: a ProDOS 8 system program, loaded and entered at $2000. This is
# the app's: the probes use newsiie.cfg, which is the same but for the
# network driver slot.
#
# The network driver slot (src/netdrv.h) is __DRVSIZE__ bytes just under
# the 512-byte C stack. Each driver is linked here, with the app, into a
# file of its own (NEWSIIE.COGS, NEWSIIE.FUJI) that runs in the slot:
# its table, code, read-only data and data, then its BSS, which netdrv.c
# clears after loading. cc65 ends the heap __STACKSIZE__ below $BF00 (the
# top of the C stack), so __STACKSIZE__ counts the slot too: the stack
# itself only ever uses the top $200. ld65 fails the link if a driver
# outgrows the slot.
#
# Started from cc65's apple2enh-system.cfg. Main memory is laid out as
# PLAN.md section 5 describes; the regions that later milestones claim
# (item index, feed table, aux store) are not reserved yet.
#
# LOWMEM is $0800-$1FFF: ProDOS leaves it to a SYS program, and nothing is
# loaded there, so it holds LOWBSS, the parser's big buffers. LOWBSS is NOT
# zeroed at startup: only put there what is written before it is read.

SYMBOLS {
    __EXEHDR__:    type = import;
    __FILETYPE__:  type = weak, value = $00FF; # ProDOS file type SYS
    __DRVSIZE__:   type = weak, value = $0FD0; # the network driver slot: the CoGS
                                               # driver, the larger, is $FCD
    __STACKSIZE__: type = weak, value = $11D0; # the slot + a 512-byte C stack: with
                                               # static locals (-Cl) it holds
                                               # only arguments and
                                               # temporaries; measured 84
                                               # deep through fetch, read,
                                               # save (0.9, filled with $A5)
    __LCADDR__:    type = weak, value = $D400; # behind the quit code
    __LCSIZE__:    type = weak, value = $0C00; # rest of bank two
}
MEMORY {
    ZP:     file = "", define = yes, start = $0080,         size = $001A;
    LOWMEM: file = "", define = yes, start = $0800,         size = $1800;
    HEADER: file = %O,               start = $2000 - $003A, size = $003A;
    MAIN:   file = %O, define = yes, start = $2000,         size = $BF00 - $2000;
    BSS:    file = "",               start = __ONCE_RUN__,  size = $BF00 - __STACKSIZE__ - __ONCE_RUN__;
    LC:     file = "", define = yes, start = __LCADDR__,    size = __LCSIZE__;
    DRVCOGS: file = "%O.COGS", define = yes, start = $BF00 - __STACKSIZE__, size = __DRVSIZE__;
    DRVFUJI: file = "%O.FUJI", define = yes, start = $BF00 - __STACKSIZE__, size = __DRVSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    EXEHDR:   load = HEADER,         type = ro,  optional = yes;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    CODE:     load = MAIN,           type = ro;
    RODATA:   load = MAIN,           type = ro;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;
    ONCE:     load = MAIN,           type = ro,  define   = yes;
    LC:       load = MAIN, run = LC, type = ro,  optional = yes;
    BSS:      load = BSS,            type = bss, define   = yes;
    LOWBSS:   load = LOWMEM,         type = bss, optional = yes;
    COGSHDR:  load = DRVCOGS,        type = ro,  optional = yes;
    COGSCODE: load = DRVCOGS,        type = ro,  optional = yes;
    COGSRO:   load = DRVCOGS,        type = ro,  optional = yes;
    COGSDATA: load = DRVCOGS,        type = rw,  optional = yes;
    COGSBSS:  load = DRVCOGS,        type = bss, optional = yes;
    FUJIHDR:  load = DRVFUJI,        type = ro,  optional = yes;
    FUJICODE: load = DRVFUJI,        type = ro,  optional = yes;
    FUJIRO:   load = DRVFUJI,        type = ro,  optional = yes;
    FUJIDATA: load = DRVFUJI,        type = rw,  optional = yes;
    FUJIBSS:  load = DRVFUJI,        type = bss, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
